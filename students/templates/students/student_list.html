<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
</head>
<body>

    <h1>Students</h1>

    <ul>
        {% for student in students %}
            <li>
                {{ student.name }}
                - {{ student.age }}
                - {{ student.branch }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
